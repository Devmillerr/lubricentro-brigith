name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: brigith
          POSTGRES_PASSWORD: brigith
          POSTGRES_DB: brigith_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      DATABASE_URL: postgresql://brigith:brigith@localhost:5432/brigith_test?schema=public
      CORS_ORIGIN: http://localhost:3000
      JWT_ACCESS_SECRET: ci-access-secret-not-for-prod
      JWT_REFRESH_SECRET: ci-refresh-secret-not-for-prod
      NEXT_PUBLIC_API_URL: http://localhost:4000/api/v1

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Instalar dependencias
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm lint

      - name: Tipos
        run: pnpm typecheck

      - name: Migraciones Prisma
        run: pnpm --filter @brigith/api exec prisma migrate deploy

      - name: Pruebas (API)
        run: pnpm --filter @brigith/api test

      - name: Pruebas e2e (API)
        run: pnpm --filter @brigith/api test:e2e

      - name: Build
        run: pnpm build
